<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mathilde Baudelocq — Media Kit</title>
    <meta
      name="description"
      content="Media Kit de Mathilde Baudelocq, athlète Trail Running aux portes du statut Élite."
    />

    <!-- Icônes & manifest -->
    <!-- PNG en priorité : le SVG natif (wordmark large) deviendrait
         minuscule une fois letterboxé dans un favicon carré. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ff7338" />
    <meta name="apple-mobile-web-app-title" content="M. Baudelocq" />

    <!-- Open Graph / Twitter — vignette utilisée par Safari, iMessage, partages sociaux -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mathilde Baudelocq" />
    <meta property="og:title" content="Mathilde Baudelocq — Media Kit" />
    <meta
      property="og:description"
      content="Media Kit de Mathilde Baudelocq, athlète Trail Running aux portes du statut Élite."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mathilde Baudelocq en course sur le Grand Raid du Ventoux" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mathilde Baudelocq — Media Kit" />
    <meta
      name="twitter:description"
      content="Media Kit de Mathilde Baudelocq, athlète Trail Running aux portes du statut Élite."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-white text-mountain-950 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
